<!doctype html>

<head>
  <!-- Custom App Icon -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<!doctype html>
<html lang="en">
  <!-- iPhone Home Screen Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

<!-- Favicon for browsers -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Station Drawer</title>

  <!-- iOS: makes it feel more app-ish when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Drawer">

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:#13131a;
      --panel2:#171724;
      --text:#f2f2f5;
      --muted:#a7a7b4;
      --line:#26263a;
      --accent:#7ee787;
      --danger:#ff6b6b;
      --btn:#1f1f2f;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 800px at 10% 0%, #141426 0%, var(--bg) 55%);
      color:var(--text);
    }
    header{ padding: 18px 18px 10px; }
    h1{ margin:0; font-size: 18px; letter-spacing: .5px; font-weight: 800; }
    .sub{ margin-top:6px; color:var(--muted); font-size: 12px; line-height: 1.35; }
    main{ padding: 12px 18px 110px; max-width: 820px; margin: 0 auto; }
    .grid{ display:grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 680px){ .grid{ grid-template-columns: 1fr 1fr; } }
    .card{
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    .row{ display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; }
    .name{ font-weight: 900; letter-spacing: .3px; font-size: 15px; margin:0; }
    .meta{ color: var(--muted); font-size: 12px; margin-top: 2px; }
    .pill{
      font-size: 11px; color: var(--muted);
      border: 1px solid var(--line);
      padding: 4px 8px; border-radius: 999px; white-space: nowrap;
    }
    .btns{ display:flex; gap: 8px; flex-wrap: wrap; }
    button, a.btn{
      appearance:none;
      border:1px solid var(--line);
      background: var(--btn);
      color: var(--text);
      padding: 10px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor:pointer;
      text-decoration: none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
    }
    button:active, a.btn:active{ transform: translateY(1px); }
    .play{ border-color: rgba(126,231,135,.35); }
    .play .dot{
      width:8px;height:8px;border-radius:999px;background:var(--accent);display:inline-block;
      box-shadow: 0 0 10px rgba(126,231,135,.45);
    }
    .stop{ border-color: rgba(255,107,107,.25); }
    .stop .dot{ background: var(--danger); box-shadow: 0 0 10px rgba(255,107,107,.35); }
    .small{ padding: 8px 10px; font-size: 12px; font-weight: 800; color: var(--muted); background: transparent; }

    .playerbar{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(10,10,16,.88);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
    .playerinner{
      max-width: 820px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      gap: 10px;
      justify-content: space-between;
    }
    .now{ min-width: 0; }
    .now .label{ font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .now .track{
      font-size: 13px; font-weight: 900;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 52vw;
    }
    audio{ width: 160px; max-width: 36vw; height: 34px; }
  </style>
</head>

<body>
  <header>
    <h1>Station Drawer</h1>
    <div class="sub">
      Tap <b>Play</b> for direct streams. If a station has no stream yet, use <b>Open player</b>.
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <div class="playerbar">
    <div class="playerinner">
      <div class="now">
        <div class="label">Now Playing</div>
        <div class="track" id="nowPlaying">Nothing yet</div>
      </div>

      <audio id="audio" controls playsinline></audio>

      <button class="stop" id="stopBtn" title="Stop">
        <span class="dot"></span> Stop
      </button>
    </div>
  </div>

  <script>
    // Your curated drawer. You can add/remove stations any time.
    // iPhone tends to like AAC and HLS streams best.
    const stations = [
  {
    name: "WFMU",
    country: "US",
    vibe: "Freeform / College aesthetic",
    stream: "https://wfmu.org/audiostream?type=aac",
    open: "https://wfmu.org/"
  },
  {
    name: "KEXP",
    country: "US",
    vibe: "Curated / Global taste",
    stream: "https://kexp.streamguys1.com/kexp160.aac",
    open: "https://www.kexp.org/listen/"
  },
  {
    name: "KPFA",
    country: "US",
    vibe: "Pacifica / Movement radio",
    stream: "",
    open: "https://kpfa.org/listen-live/"
  },
  {
    name: "KPCC (LAist 89.3)",
    country: "US",
    vibe: "Public radio / Civic sanity",
    stream: "",
    open: "https://laist.com/listen"
  },
  {
    name: "RTÉ Radio 1",
    country: "IE",
    vibe: "Public radio / News + culture",
    stream: "",
    open: "https://www.rte.ie/radio/radio1/"
  },
  {
    name: "Resonance FM",
    country: "UK",
    vibe: "Arts / Experimental / Left",
    stream: "https://stream.resonance.fm/resonance",
    open: "https://www.resonancefm.com/"
  },
  {
    name: "Noods Radio",
    country: "UK",
    vibe: "Underground / Modern electronic",
    stream: "",
    open: "https://noodsradio.com/"
  },
  {
    name: "Kiosk Radio",
    country: "BE",
    vibe: "Club culture with brains",
    stream: "",
    open: "https://kioskradio.com/"
  },

  // New additions:
  {
    name: "Radio UNAM",
    country: "MX",
    vibe: "University radio / Experimental + intellectual CDMX",
    stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_UNAM_HQAAC.aac",
    open: "https://www.radio.unam.mx/"
  },
  {
    name: "Red Light Radio",
    country: "NL",
    vibe: "Amsterdam underground / Electronic + experimental",
    stream: "",
    open: "https://www.redlightradio.net/"
  },
  {
    name: "Sveriges Radio P3",
    country: "SE",
    vibe: "Swedish music / Modern + youth culture",
    stream: "",
    open: "https://sverigesradio.se/p3"
  }
];


    const grid = document.getElementById("grid");
    const audio = document.getElementById("audio");
    const nowPlaying = document.getElementById("nowPlaying");
    const stopBtn = document.getElementById("stopBtn");

    function mk(tag, attrs={}, children=[]) {
      const el = document.createElement(tag);
      for (const [k,v] of Object.entries(attrs)) {
        if (k === "class") el.className = v;
        else el.setAttribute(k, v);
      }
      children.forEach(c => el.appendChild(c));
      return el;
    }

    async function playStation(st) {
      if (!st.stream) {
        alert(`No direct stream set for ${st.name} yet. Use “Open player”.`);
        window.open(st.open, "_blank", "noopener,noreferrer");
        return;
      }
      try {
        nowPlaying.textContent = `${st.name} — ${st.vibe}`;
        audio.src = st.stream;
        await audio.play();
      } catch (e) {
        alert(`Playback hiccup for ${st.name}. Use “Open player”.`);
        window.open(st.open, "_blank", "noopener,noreferrer");
      }
    }

    function stop() {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      nowPlaying.textContent = "Nothing yet";
    }
    stopBtn.addEventListener("click", stop);

    stations.forEach(st => {
      const left = mk("div", {}, [
        mk("div", {class:"name"}, []),
        mk("div", {class:"meta"}, [])
      ]);
      left.children[0].textContent = st.name;
      left.children[1].textContent = `${st.country} · ${st.vibe}`;

      const pill = mk("div", {class:"pill"}, []);
      pill.textContent = st.stream ? "direct stream" : "open link";

      const headerRow = mk("div", {class:"row"}, [left, pill]);

      const playBtn = mk("button", {class:"play"}, []);
      playBtn.innerHTML = `<span class="dot"></span> Play`;
      playBtn.addEventListener("click", () => playStation(st));

      const openBtn = mk("a", {class:"btn small", href: st.open, target: "_blank", rel:"noopener noreferrer"}, []);
      openBtn.textContent = "Open player";

      const btns = mk("div", {class:"btns"}, [playBtn, openBtn]);

      const card = mk("div", {class:"card"}, [headerRow, btns]);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
